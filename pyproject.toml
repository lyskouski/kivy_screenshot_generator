[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kivy-screenshot-generator"
version = "1.0.0"
description = "Generate screenshots for a Kivy application across different screens and languages."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Viachaslau Lyskouski" }]
requires-python = ">=3.9"
dependencies = ["kivy>=2.1.0"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/lyskouski/kivy_screenshot_generator"
Repository = "https://github.com/lyskouski/kivy_screenshot_generator"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
